# hyprctl dispatch takes Lua since Hyprland 0.55: `dispatch dpms off` is a parse error, use hl.dsp.dpms({ action = ... })
general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd =                                   # let hyprlock exit on its own
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # avoid pressing a key twice to wake the display
}

listener {
    timeout = 600                      # 10 min idle -> lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660                                                                 # 11 min idle -> screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r # screen + brightness back on activity
}
